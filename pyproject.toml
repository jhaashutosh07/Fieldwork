[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldwork"
version = "0.5.0"
description = "Account-research agent with a trace-to-eval flywheel, scored against real Wikidata gold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashutosh Kumar Jha" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "requests>=2.31",
  "openai>=1.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fieldwork = "fieldwork.cli:main"

[tool.setuptools]
packages = ["fieldwork", "fieldwork.data"]

[tool.setuptools.package-data]
fieldwork = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
