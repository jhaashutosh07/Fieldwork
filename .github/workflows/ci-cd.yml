name: ci-cd

# Every push and PR: unit tests -> eval gate -> container build + smoke test.
# Render is set to deploy main only after these checks pass (render.yaml: autoDeployTrigger: checksPass),
# so a change that regresses the agent never reaches the live site.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # least privilege for the workflow token

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests + eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Eval gate (held-out metrics + every regression case, recorded LLM answers)
        run: fieldwork gate --llm replay | tee gate.txt
      - name: Experiments reproduce from recorded answers (learning from review, framework comparison)
        run: fieldwork learn --llm replay && fieldwork frameworks --llm replay
      - name: Gate summary
        if: always()
        run: |
          echo '### Eval gate' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat gate.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  security:
    name: security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e . pip-audit bandit
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable
      - name: Static analysis (bandit, medium+ severity)
        run: bandit -q -r fieldwork -ll

  container:
    name: docker build + smoke test
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t fieldwork:ci .
      - name: Boot and probe
        run: |
          docker run -d --name fw -p 8000:8000 fieldwork:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/history | python3 -c "import json,sys; h=json.load(sys.stdin); assert len(h) >= 4, h; print('history ok:', [e['version'] for e in h])"
          curl -fs -X POST http://127.0.0.1:8000/api/runs -H 'content-type: application/json' -d '{"version":"v4","split":"dev","llm":"none"}' | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['metrics']['verified_accuracy'] > 0.8, r; print('run ok:', r['metrics']['verified_accuracy'])"
          curl -fs http://127.0.0.1:8000/ | grep -q "<title>Fieldwork</title>"
          curl -fs -X POST http://127.0.0.1:8000/api/try -H 'content-type: application/json' -d '{"account_name":"adobe","website":"business.adobe.com"}' | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['account']['fields']['domain']['value'] == 'adobe.com', r; print('try ok')"
          curl -fs -X POST http://127.0.0.1:8000/api/batch -H 'content-type: application/json' -d '{"csv":"name,website\nadobe,business.adobe.com\nADBE,business.adobe.com"}' | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['summary']['accounts'] == 1, d; print('batch ok')"
          sleep 2.5   # the public demo allows one try per client every 2 s
          curl -fsN -X POST http://127.0.0.1:8000/api/try/stream -H 'content-type: application/json' -d '{"account_name":"UberCab","hq_country":"Netherlands"}' | grep "event: done" > /dev/null && echo "stream ok"
      - name: Container logs
        if: failure()
        run: docker logs fw
