# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fieldwork
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass   # deploy main only after the GitHub Actions checks pass
    envVars:
      - key: FIELDWORK_PUBLIC
        value: "1"
      - key: FIELDWORK_LLM
        value: replay
      # Optional: live LLM for the "Try the agent" box (capped per day, never written to the eval cache).
      # Leave GROQ_API_KEY empty to serve recorded answers only.
      - key: FIELDWORK_TRY_LIVE
        value: "1"
      - key: GROQ_API_KEY
        sync: false
